<svg class="intro-terrain" viewBox="0 0 300 180" width="300" height="180" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="survey-grid" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="matrix(1 .19 -.66 .44 0 64)">
      <path d="M20 0H0V20" fill="none" stroke="#abc5d7" stroke-width=".85"/>
    </pattern>
  </defs>
  <path d="M9 119 110 65l179 32-100 64Z" fill="url(#survey-grid)"/>
  <g fill="none" stroke="#90aabd" stroke-width="1">
    <path d="M12 48v-6h8m261 0h8v6M12 144v6h8m261 0h8v-6"/>
  </g>
  {% assign ridge = "M-123 3 C-120 -6 -97 -10 -86 -15 C-74 -21 -71 -30 -55 -33 C-43 -35 -33 -31 -20 -34 C-8 -36 2 -45 19 -44 C35 -43 45 -34 59 -32 C76 -29 87 -30 99 -23 C109 -17 111 -9 119 -4 C129 4 125 11 109 15 C88 21 82 32 61 32 C43 32 36 27 22 30 C9 34 -1 43 -22 41 C-38 39 -45 30 -59 28 C-75 26 -87 29 -98 23 C-109 17 -125 14 -123 3 Z" %}
  {% for level in (0..17) %}
    {% assign inset = level | times: 0.053 %}
    {% assign scale = 1 | minus: inset %}
    {% assign x = level | times: 1.1 | plus: 147 %}
    {% assign y = level | times: 3.45 | times: -1 | plus: 112 %}
    {% assign major = level | modulo: 4 %}
    <g transform="translate({{ x }} {{ y }}) scale({{ scale }})"><path class="terrain-contour{% if major == 0 %} index-contour{% endif %}" d="{{ ridge }}" vector-effect="non-scaling-stroke"/></g>
  {% endfor %}
</svg>

<script src="assets/js/main.min.js"></script>
<script>
  (function () {
    var button = document.querySelector('#site-nav button');
    var links = document.getElementById('more-links');
    function syncMenuState() {
      button.setAttribute('aria-expanded', String(!links.classList.contains('hidden')));
    }
    new MutationObserver(syncMenuState).observe(links, { attributes: true, attributeFilter: ['class'] });
    links.addEventListener('click', function (event) {
      if (event.target.closest('a') && !links.classList.contains('hidden')) button.click();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !links.classList.contains('hidden')) {
        button.click();
        button.focus();
      }
    });
  })();
</script>

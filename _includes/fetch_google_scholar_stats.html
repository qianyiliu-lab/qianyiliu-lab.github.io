<script>
  (function () {
    const papers = document.querySelectorAll('[data-scholar-id]');
    const total = document.getElementById('total_cit');
    if (!papers.length && !total) return;
    {% if site.google_scholar_stats_use_cdn %}
    const url = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json';
    {% else %}
    const url = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json';
    {% endif %}
    fetch(url).then(function (response) {
      if (!response.ok) throw new Error('Citation data unavailable');
      return response.json();
    }).then(function (data) {
      if (total && Number.isInteger(data.citedby)) total.textContent = data.citedby;
      papers.forEach(function (element) {
        const paper = (data.publications || {})[element.dataset.scholarId];
        if (paper && Number.isInteger(paper.num_citations)) {
          element.textContent = 'Citations: ' + paper.num_citations;
        }
      });
    }).catch(function () {
      // The server-rendered label already indicates that a count is unavailable.
    });
  })();
</script>

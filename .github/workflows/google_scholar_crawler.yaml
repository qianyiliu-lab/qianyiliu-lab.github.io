name: Get Citation Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google_scholar_crawler.yaml"
      - "google_scholar_crawler/**"
      - "_includes/fetch_google_scholar_stats.html"
      - "_data/publications.yml"
      - "_config.yml"
  schedule:
    - cron: "17 8 * * *"

permissions: {}
concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      base: ${{ steps.cache.outputs.base }}
      snapshot: ${{ steps.collect.outputs.snapshot }}
      badge: ${{ steps.collect.outputs.badge }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install and test crawler and display
        run: |
          python -m pip install --only-binary=:all: -r google_scholar_crawler/requirements.txt
          python -m unittest discover -s google_scholar_crawler -p 'test_*.py'
          node --test google_scholar_crawler/test_display.cjs
      - name: Read authoritative cache
        id: cache
        shell: bash
        run: |
          # Only an absent branch is a cold start. Transport or file errors must stop publication.
          ref=$(git ls-remote origin refs/heads/google-scholar-stats)
          base=${ref%%[[:space:]]*}
          if [[ -n "$base" ]]; then
            git fetch --depth=1 origin "$base"
            git show "${base}:gs_data.json" > "$RUNNER_TEMP/previous.json"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Observe public citation sources
        id: collect
        shell: bash
        run: |
          args=()
          if [[ -f "$RUNNER_TEMP/previous.json" ]]; then args+=(--previous "$RUNNER_TEMP/previous.json"); fi
          dest="$RUNNER_TEMP/results"
          python google_scholar_crawler/main.py "${args[@]}" --output "$dest"
          jq -c . "$dest/gs_data.json" | sed 's/^/snapshot=/' >> "$GITHUB_OUTPUT"
          jq -c . "$dest/gs_data_shieldsio.json" | sed 's/^/badge=/' >> "$GITHUB_OUTPUT"

  publish:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Publish observations without rewriting branch history
        shell: bash
        env:
          BASE: ${{ needs.sync.outputs.base }}
          SNAPSHOT: ${{ needs.sync.outputs.snapshot }}
          BADGE: ${{ needs.sync.outputs.badge }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --initial-branch=google-scholar-stats "$RUNNER_TEMP/stats"
          cd "$RUNNER_TEMP/stats"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [[ -n "$BASE" ]]; then
            git fetch --depth=1 origin "$BASE"
            git reset --mixed FETCH_HEAD
          fi
          : "${SNAPSHOT:?missing citation snapshot}" "${BADGE:?missing badge}"
          jq -e 'select(.schema_version == 2 and .scholar_id == "UmPI1h0AAAAJ")' <<< "$SNAPSHOT" > gs_data.json
          jq -e 'select(.schemaVersion == 1 and (.message | type == "string"))' <<< "$BADGE" > gs_data_shieldsio.json
          test -s gs_data.json
          test -s gs_data_shieldsio.json
          git add -- gs_data.json gs_data_shieldsio.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh citation observations"
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/google-scholar-stats

name: Get Citation Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google_scholar_crawler.yaml"
      - "google_scholar_crawler/**"
      - "_data/publications.yml"
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Download last successful citation data
        continue-on-error: true
        run: |
          mkdir -p google_scholar_crawler/previous
          curl --fail --location --retry 3 \
            --output google_scholar_crawler/previous/gs_data.json \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/google-scholar-stats/gs_data.json"
          curl --fail --location --retry 3 \
            --output google_scholar_crawler/previous/gs_data_shieldsio.json \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/google-scholar-stats/gs_data_shieldsio.json"

      - name: Fetch Google Scholar data
        id: scholar
        continue-on-error: true
        timeout-minutes: 2
        env:
          GOOGLE_SCHOLAR_ID: UmPI1h0AAAAJ
        run: python google_scholar_crawler/main.py

      - name: Preserve last successful data when Scholar is unavailable
        if: steps.scholar.outcome != 'success'
        run: |
          echo "::warning::Google Scholar is unavailable from this runner; preserving the last successful citation data."
          test -f google_scholar_crawler/previous/gs_data.json
          mkdir -p google_scholar_crawler/results
          cp google_scholar_crawler/previous/gs_data.json google_scholar_crawler/results/gs_data.json
          cp google_scholar_crawler/previous/gs_data_shieldsio.json google_scholar_crawler/results/gs_data_shieldsio.json

      - name: Publish citation data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd google_scholar_crawler/results
          git init
          git checkout -b google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Update citation data"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin google-scholar-stats
